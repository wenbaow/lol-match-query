[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lol-match-query"
version = "1.0.0"
description = "英雄联盟违规标记查询工具（基于 LCU 本地接口）"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "All rights reserved" }
authors = [{ name = "LoLMatchQuery Contributors" }]
keywords = ["lol", "league-of-legends", "lcu", "customtkinter"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "requests>=2.25.0",
    "psutil>=5.8.0",
    "websocket-client>=1.0.0",
    "customtkinter>=5.0.0",
    "Pillow>=8.0.0",
    "urllib3>=1.26.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.gui-scripts]
lol-match-query = "lol_match_query.app:main"
